<!doctype html>
<html lang="en" data-loading>
  <head>
    <meta charset="utf-8">
    <script>
      try {
        const colour = localStorage.getItem(matchMedia("(prefers-color-scheme: dark)").matches
                                            ? "bareblog-colour-dark" : "bareblog-colour-light");
        if (colour) document.documentElement.style.backgroundColor = colour;
      } catch (e) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BareBlog</title>
    <link rel="alternate" type="application/atom+xml" href="/feed.xml">
    <link rel="stylesheet" href="/app.css">
    <link rel="stylesheet" href="/blog.css">
    <link rel="stylesheet" href="/journal.css">
    <link rel="stylesheet" href="/notebook.css">
    <link rel="stylesheet" href="/magazine.css">
    <link rel="stylesheet" href="/longform.css">
    <link rel="stylesheet" href="/diary.css">
    <script type="module" src="/js/app.js"></script>
  </head>
  <body></body>
</html>
